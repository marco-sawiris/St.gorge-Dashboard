name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
    paths-ignore:
      - "Final App/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: TypeScript, tests and production web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript validation
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Production web build
        run: npm run build

  android-debug-build:
    name: Capacitor sync, verify and deliver Android APK
    needs: web-validation
    if: ${{ success() && (github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android plugins and assets
        run: npx cap sync android

      - name: Assemble Android debug APK
        run: |
          chmod +x android/gradlew
          cd android && bash ./gradlew assembleDebug --no-daemon

      - name: Verify APK and deliver to Final App
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_SRC"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_SRC" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_SRC"
          mkdir -p "Final App"
          cp "$APK_SRC" "Final App/StGeorge-Dashboard.apk"
          ls -lh "Final App/StGeorge-Dashboard.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: st-george-dashboard-final-apk
          path: Final App/StGeorge-Dashboard.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push Final App APK to main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "Final App/StGeorge-Dashboard.apk" /tmp/StGeorge-Dashboard.apk
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "Final App"
            cp /tmp/StGeorge-Dashboard.apk "Final App/StGeorge-Dashboard.apk"
            git add -f "Final App/StGeorge-Dashboard.apk"
            if git diff --cached --quiet; then
              echo "Final App/StGeorge-Dashboard.apk is already up to date."
              exit 0
            fi
            git commit -m "chore(release): build and update Final App/StGeorge-Dashboard.apk [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt saw a newer commit on main; retrying without rebase..."
            sleep 3
          done
          exit 1

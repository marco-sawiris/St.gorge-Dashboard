    <script>
      (function() {
        try {
          var saved = localStorage.getItem('stgorge_theme');
          var theme = (saved === 'light' || saved === 'dark' || saved === 'dim') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark' || theme === 'dim');
          document.documentElement.classList.toggle('light', theme === 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F0F4FA' : '#030711');
        } catch (e) {}
      })();
    </script>
